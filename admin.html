<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BJKP Admin Panel</title><link rel="stylesheet" href="admin.css"></head><body>
<header><img src="assets/logo.png"><div><h1>BJKP Admin Panel</h1><p>वेबसाइट प्रबंधन</p></div></header>
<main><section id="loginBox" class="panel"><h2>Admin Login</h2><p>Supabase Auth में बनाए गए admin email/password से login करें।</p><input id="email" type="email" placeholder="Admin email"><input id="password" type="password" placeholder="Password"><button id="login">Login</button><div id="loginMsg"></div></section>
<section id="dash" class="hidden"><div class="bar"><h2>Dashboard</h2><button id="logout">Logout</button></div>
<div class="tabs"><button data-tab="news">समाचार</button><button data-tab="announcements">घोषणाएँ</button><button data-tab="officers">पदाधिकारी</button><button data-tab="gallery">गैलरी</button><button data-tab="videos">वीडियो</button><button data-tab="memberships">सदस्य आवेदन</button></div>
<div id="news" class="tab panel"><h3>समाचार जोड़ें</h3><form id="newsForm"><input name="title" placeholder="समाचार शीर्षक" required><input name="published_at" type="date"><button>जोड़ें</button></form><div id="newsRows"></div></div>
<div id="announcements" class="tab panel hidden"><h3>घोषणा जोड़ें</h3><form id="announcementForm"><input name="title" placeholder="घोषणा" required><button>जोड़ें</button></form><div id="announcementRows"></div></div>
<div id="officers" class="tab panel hidden"><h3>पदाधिकारी जोड़ें</h3><form id="officerForm"><input name="name" placeholder="नाम" required><input name="role" placeholder="पद" required><button>जोड़ें</button></form><div id="officerRows"></div></div>
<div id="gallery" class="tab panel hidden"><h3>गैलरी फोटो</h3><p>पहले फोटो को किसी public image URL पर upload करें, फिर URL यहाँ डालें।</p><form id="galleryForm"><input name="title" placeholder="फोटो शीर्षक"><input name="image_url" placeholder="https://..." required><button>जोड़ें</button></form><div id="galleryRows"></div></div>
<div id="videos" class="tab panel hidden"><h3>वीडियो</h3><form id="videoForm"><input name="title" placeholder="वीडियो शीर्षक"><input name="video_url" placeholder="YouTube embed URL" required><button>जोड़ें</button></form><div id="videoRows"></div></div>
<div id="memberships" class="tab panel hidden"><h3>सदस्यता आवेदन</h3><div id="memberRows"></div></div>
</section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="admin.js"></script></body></html>
